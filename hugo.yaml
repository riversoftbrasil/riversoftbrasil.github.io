# Hugo configuration file
title: Riversoft
baseURL: https://learn.riversoft.com.br

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false

menu:
  main:
    # - name: Changelog
    #   pageRef: /changelog
    #   weight: 1
    - name: Search
      weight: 4
      params:
        type: search
    - name: Website
      weight: 5
      url: "https://www.riversoft.com.br/"
      params:
        icon: globe-alt

params:

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo-river.png
      dark: images/logo-river-dark.png
      link: /
      width: 155

  search:
    enable: true
    type: flexsearch

    flexsearch:
      # full | forward | reverse | strict
      tokenize: forward

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  displayUpdatedAuthor: true
  displayUpdatedDate: true
  dateFormat: "2/1/2006"

  editURL:
    enable: false
    base: "https://riversoftbrasil.github.io/edit/main/content"

  theme:
    default: system
    displayToggle: true
  page:
    contextMenu:
      enable: false

defaultContentLanguage: pt-br

outputs:
  page: [html, markdown]
  section: [html, rss, markdown]

languages:
  pt-br:
    label: Português
    weight: 1
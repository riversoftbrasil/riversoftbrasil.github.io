# Hugo configuration file
title: Riversoft
baseURL: https://learn.riversoft.com.br

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    # - name: Docs
    #   pageRef: /docs
    #   weight: 1
    # - name: About
    #   pageRef: /about
    #   weight: 2
    # - name: Contact ↗
    #   url: "https://github.com/imfing"
    #   weight: 3
    # - name: Search
    #   weight: 4
    #   params:
    #     type: search
    # # - name: GitHub
    #   weight: 5
    #   url: "https://github.com/imfing/hextra-starter-template"
    #   params:
    #     icon: github
    # - name: Twitter
    #   weight: 6
    #   url: "https://twitter.com/"
    #   params:
    #     icon: x-twitter
    - name: Website
      weight: 5
      url: "https://www.riversoft.com.br/"
      params:
        icon: globe-alt
  # sidebar:
  #   - name: "Referência da API"
  #     params:
  #       type: separator
  #     weight: 1
  #   - name: "Gemini APIv2"
  #     pageRef: "/stcp-gemini/api-reference/"
  #     weight: 2
  #   - name: "Directlink APIv2"
  #     pageRef: "/about"
  #     weight: 2

params:
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo-river.png
      dark: images/logo-river-dark.png
      link: /
      width: 155

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  editURL:
    enable: false
    base: "https://riversoftbrasil.github.io/edit/main/content"

  theme:
    # light | dark | system
    default: system
    displayToggle: true
  
defaultContentLanguage: pt-br
languages:
  pt-br:
    label: Português
    weight: 1
